# Development services for autoplatz-platform. `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autoplatz_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Another local Postgres on 5432? `DB_PORT=5440 docker compose up -d` and the same DB_PORT for the API.
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoplatz_platform"]
      interval: 5s
      retries: 10

volumes:
  db-data:
